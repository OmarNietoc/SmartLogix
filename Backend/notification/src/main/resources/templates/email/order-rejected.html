<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pedido rechazado — SmartLogix</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f4;font-family:Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center" style="padding:40px 0;">
        <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;overflow:hidden;">
          <tr>
            <td style="background:#b71c1c;padding:24px 32px;">
              <h1 style="margin:0;color:#ffffff;font-size:22px;">SmartLogix</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <h2 style="margin:0 0 16px;color:#b71c1c;font-size:20px;">Pedido no procesado</h2>
              <p style="color:#555;font-size:15px;line-height:1.6;">
                Hola <strong th:text="${customerName}">Cliente</strong>, lamentamos informarte que tu pedido no pudo ser procesado.
              </p>
              <table width="100%" cellpadding="12" cellspacing="0" style="background:#ffebee;border-radius:6px;margin:24px 0;">
                <tr>
                  <td>
                    <p style="margin:0;color:#c62828;font-size:14px;">
                      <strong>Número de pedido:</strong><br>
                      <span th:text="${orderId}" style="font-size:15px;font-family:monospace;"></span>
                    </p>
                  </td>
                </tr>
                <tr>
                  <td>
                    <p style="margin:0;color:#555;font-size:14px;">
                      <strong>Motivo:</strong> <span th:text="${reason}">Sin stock disponible</span>
                    </p>
                  </td>
                </tr>
              </table>
              <p style="color:#888;font-size:13px;">Puedes intentarlo nuevamente cuando el producto esté disponible.</p>
            </td>
          </tr>
          <tr>
            <td style="background:#f4f4f4;padding:16px 32px;text-align:center;">
              <p style="margin:0;color:#aaa;font-size:12px;">SmartLogix — Plataforma Logística Inteligente</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
