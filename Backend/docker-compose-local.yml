name: smartlogix-backend

services:
  # --- Databases ---
  postgres-shipping:
    image: 'postgres:15-alpine'
    container_name: pg-shipping-local
    environment:
      POSTGRES_DB: shipping_db
      POSTGRES_PASSWORD: ${SHIPPING_DB_PASSWORD:-postgres}
      POSTGRES_USER: postgres
    ports:
      - '5432:5432'
    volumes:
      - pg-shipping-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shipping_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'

  postgres-inventory:
    image: 'postgres:15-alpine'
    container_name: pg-inventory-local
    environment:
      POSTGRES_DB: smartlogix_inventory
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:-postgres}
      POSTGRES_USER: postgres
    ports:
      - '5433:5432'
    volumes:
      - pg-inventory-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartlogix_inventory"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'

  postgres-order:
    image: 'postgres:15-alpine'
    container_name: pg-order-local
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-postgres}
      POSTGRES_USER: postgres
    ports:
      - '5434:5432'
    volumes:
      - pg-order-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderdb"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'

  postgres-notification:
    image: 'postgres:15-alpine'
    container_name: pg-notification-local
    environment:
      POSTGRES_DB: notificationdb
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-postgres}
      POSTGRES_USER: postgres
    ports:
      - '5435:5432'
    volumes:
      - pg-notification-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notificationdb"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'

  postgres-auth:
    image: 'postgres:15-alpine'
    container_name: pg-auth-local
    environment:
      POSTGRES_DB: authdb
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-postgres}
      POSTGRES_USER: postgres
    ports:
      - '5436:5432'
    volumes:
      - pg-auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'

  pg-users-local:
    image: postgres:15-alpine
    container_name: pg-users-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:-postgres}
      POSTGRES_DB: db_users
    ports:
      - "5437:5432"
    volumes:
      - pg-users-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_users"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'

  # --- Infraestructura ---
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq-local
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 20s
      start_period: 60s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: '0.25'

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server-local
    ports:
      - '8761:8761'
    environment:
      - SERVER_PORT=8761
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761 || exit 1"]
      interval: 5s
      timeout: 5s
      start_period: 90s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: '0.25'

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway-local
    ports:
      - '8080:8080'
    environment:
      - SERVER_PORT=8080
      - EUREKA_URI=http://eureka-server-local:8761/eureka/
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      eureka-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: '0.5'

  # --- Microservicios ---
  ms-shipping:
    build:
      context: ./shipping
      dockerfile: Dockerfile
    container_name: ms-shipping-local
    ports:
      - '8084:8084'
    environment:
      - DB_URL=jdbc:postgresql://postgres-shipping:5432/shipping_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=${SHIPPING_DB_PASSWORD:-postgres}
      - SERVER_PORT=8084
      - EUREKA_URI=http://eureka-server-local:8761/eureka/
      - RABBITMQ_HOST=rabbitmq-local
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASS:-guest}
    depends_on:
      postgres-shipping:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  ms-inventory:
    build:
      context: ./inventory
      dockerfile: Dockerfile
    container_name: ms-inventory-local
    ports:
      - '8081:8081'
    environment:
      - DB_URL=jdbc:postgresql://postgres-inventory:5432/smartlogix_inventory
      - DB_USERNAME=postgres
      - DB_PASSWORD=${INVENTORY_DB_PASSWORD:-postgres}
      - SERVER_PORT=8081
      - EUREKA_URI=http://eureka-server-local:8761/eureka/
      - RABBITMQ_HOST=rabbitmq-local
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASS:-guest}
    depends_on:
      postgres-inventory:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  ms-order:
    build:
      context: ./order
      dockerfile: Dockerfile
    container_name: ms-order-local
    ports:
      - '8082:8082'
    environment:
      - DB_URL=jdbc:postgresql://postgres-order:5432/orderdb
      - DB_USERNAME=postgres
      - DB_PASSWORD=${ORDER_DB_PASSWORD:-postgres}
      - SERVER_PORT=8082
      - EUREKA_URI=http://eureka-server-local:8761/eureka/
      - RABBITMQ_HOST=rabbitmq-local
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASS:-guest}
    depends_on:
      postgres-order:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  ms-notification:
    build:
      context: ./notification
      dockerfile: Dockerfile
    container_name: ms-notification-local
    ports:
      - '8085:8085'
    environment:
      - DB_URL=jdbc:postgresql://postgres-notification:5432/notificationdb
      - DB_USERNAME=postgres
      - DB_PASSWORD=${NOTIFICATION_DB_PASSWORD:-postgres}
      - SERVER_PORT=8085
      - EUREKA_URI=http://eureka-server-local:8761/eureka/
      - RABBITMQ_HOST=rabbitmq-local
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASS:-guest}
      - SMTP_HOST=${SMTP_HOST:-sandbox.smtp.mailtrap.io}
      - SMTP_PORT=${SMTP_PORT:-2525}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-noreply@smartlogix.cl}
    depends_on:
      postgres-notification:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  ms-users:
    build:
      context: ./users
      dockerfile: Dockerfile
    container_name: ms-users-local
    restart: unless-stopped
    ports:
      - "8083:8083"
    env_file:
      - ./users/.env
    depends_on:
      pg-users-local:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  ms-auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: ms-auth-local
    ports:
      - '8086:8086'
    environment:
      - DB_URL=jdbc:postgresql://postgres-auth:5432/authdb
      - DB_USERNAME=postgres
      - DB_PASSWORD=${AUTH_DB_PASSWORD:-postgres}
      - SERVER_PORT=8086
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=86400000
      - EUREKA_URI=http://eureka-server-local:8761/eureka/
    depends_on:
      postgres-auth:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

volumes:
  pg-shipping-data:
  pg-inventory-data:
  pg-order-data:
  pg-notification-data:
  pg-auth-data:
  pg-users-data:
  rabbitmq-data:
